name: CI - Pull Request

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, typecheck, test:coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    # env.ts faz fail-fast no boot se DATABASE_URL/JWT_SECRET nao estiverem
    # definidos. Esses valores sao dummies — nao tocam em banco real, so
    # satisfazem o config loader durante os testes.
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      JWT_SECRET: ci-only-test-secret-not-for-production
      CORS_ORIGIN: "*"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: i18n parity check
        run: yarn i18n:check

      - name: Test with coverage
        run: yarn test:coverage --coverage.reporter=text --coverage.reporter=html --coverage.reporter=lcov --coverage.reporter=json-summary

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage-pr-${{ github.event.pull_request.number }}
          path: coverage/
          retention-days: 14

      - name: Extract coverage summary
        if: always()
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
            BRANCHES=$(node -p "require('./coverage/coverage-summary.json').total.branches.pct")
            FUNCTIONS=$(node -p "require('./coverage/coverage-summary.json').total.functions.pct")
            STATEMENTS=$(node -p "require('./coverage/coverage-summary.json').total.statements.pct")
          else
            LINES="n/a"; BRANCHES="n/a"; FUNCTIONS="n/a"; STATEMENTS="n/a"
          fi
          {
            echo "lines=$LINES"
            echo "branches=$BRANCHES"
            echo "functions=$FUNCTIONS"
            echo "statements=$STATEMENTS"
          } >> "$GITHUB_OUTPUT"

      - name: Comment coverage on PR
        if: always() && github.event.pull_request != null
        uses: actions/github-script@v7
        with:
          script: |
            const lines = '${{ steps.coverage.outputs.lines }}';
            const branches = '${{ steps.coverage.outputs.branches }}';
            const functions = '${{ steps.coverage.outputs.functions }}';
            const statements = '${{ steps.coverage.outputs.statements }}';
            const body = [
              '### AutoSoccer Server — Coverage report',
              '',
              '| Metric | % |',
              '| --- | --- |',
              `| Lines | ${lines} |`,
              `| Branches | ${branches} |`,
              `| Functions | ${functions} |`,
              `| Statements | ${statements} |`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
