name: CI - main (staging)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, typecheck, test:coverage, sonar, tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # env.ts faz fail-fast no boot se DATABASE_URL/JWT_SECRET nao estiverem
    # definidos. Esses valores sao dummies — nao tocam em banco real, so
    # satisfazem o config loader durante os testes. NODE_ENV=test tambem
    # desabilita o guard de CORS wildcard em producao.
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      JWT_SECRET: ci-only-test-secret-not-for-production
      CORS_ORIGIN: "*"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar precisa do histórico completo para blame
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: i18n parity check
        run: yarn i18n:check

      - name: Test with coverage
        run: yarn test:coverage --coverage.reporter=text --coverage.reporter=html --coverage.reporter=lcov --coverage.reporter=json-summary

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage-main-${{ github.sha }}
          path: coverage/
          retention-days: 30

      # SonarCloud e tag de staging sao opcionais: nao queremos quebrar o
      # pipeline (testes + lint + typecheck) se o Sonar estiver com config
      # divergente do projectKey, ou se uma tag duplicada surgir em um
      # re-run. Os erros viram aviso no summary do run em vez de failure.
      #
      # A action SonarSource/sonarcloud-github-action foi deprecada em 2025
      # — agora a recomendada e sonarqube-scan-action@v6, que funciona
      # tanto para SonarQube Server quanto SonarCloud (v5 foi deprecada com
      # security vulnerability — ver community.sonarsource.com/gha-v6-update).
      - name: SonarCloud Scan
        if: success()
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Tag staging release
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const shortSha = context.sha.slice(0, 7);
            const tag = `staging-${date}-${shortSha}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Tag criada: ${tag}`);
            } catch (err) {
              if (err.status === 422) {
                core.warning(`Tag ${tag} já existe — pulando.`);
              } else {
                throw err;
              }
            }
