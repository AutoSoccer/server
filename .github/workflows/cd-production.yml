name: CD - Production (Cloudways)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente alvo do deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      confirm:
        description: 'Digite "DEPLOY" para confirmar (proteção contra disparo acidental)'
        required: true
        type: string

concurrency:
  group: cd-production-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validar confirmação manual
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check confirm input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmação inválida. Para disparar manualmente, digite DEPLOY no input."
            exit 1
          fi

  deploy:
    name: Deploy via SSH no Cloudways
    needs: [guard]
    if: |
      always() &&
      (needs.guard.result == 'success' || needs.guard.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show deploy context
        run: |
          echo "Ambiente: ${{ github.event.inputs.environment || 'production' }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CLOUDWAYS_SSH_HOST }}
          username: ${{ secrets.CLOUDWAYS_SSH_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: ${{ secrets.CLOUDWAYS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/public_html
            echo "==> git pull origin main"
            git pull origin main
            echo "==> yarn install --frozen-lockfile"
            yarn install --frozen-lockfile --cache-folder ~/tools/yarn-cache
            echo "==> yarn build"
            yarn build
            echo "==> yarn db:migrate"
            yarn db:migrate
            echo "==> pm2 reload autosoccer-api"
            pm2 reload autosoccer-api
            echo "==> Deploy concluído."

      - name: Post-deploy summary
        if: always()
        run: |
          {
            echo "## AutoSoccer Server — Deploy summary"
            echo ""
            echo "- Ambiente: \`${{ github.event.inputs.environment || 'production' }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- Resultado: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
