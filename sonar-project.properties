sonar.projectKey=AutoSoccer_server
sonar.organization=autosoccer

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts

# Exclusoes de arquivos que nao entram no calculo de coverage:
# - *.test.ts: arquivos de teste em si.
# - __tests__/**: factories e helpers de teste (suporte, nao logica).
# - *.routes.ts: bindings finos do Fastify — testados via integration.
# - *.model.ts, **/types.ts: declaracoes Sequelize/tipos (sem runtime).
# - *.schemas.ts: schemas Fastify (declarativo).
# - migrations + seed bootstrap + index.ts/app.ts: infra de boot.
# - i18n + config + admin/reports/shared: sem testes diretos (debito tecnico).
# - database/models: definicoes Sequelize (schema declarativo).
# - plugins/swagger.ts: config Swagger (declarativo).
# - simulador/simulador.errors.ts: classes de erro tipadas.
# - simulador/index.ts: barrel de re-exports.
sonar.exclusions=**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**,**/*.routes.ts,**/*.model.ts,**/*.schemas.ts,**/types.ts,src/__tests__/**,src/database/migrations/**,src/database/models/**,src/database/index.ts,src/database/config.cjs,src/i18n/**,src/config/**,src/index.ts,src/app.ts,src/modules/admin/**,src/modules/reports/**,src/modules/shared/**,src/plugins/swagger.ts,src/modules/simulador/simulador.errors.ts,src/modules/simulador/index.ts

# sonar.typescript.lcov.reportPaths foi deprecado em 2023 —
# sonar.javascript.lcov.reportPaths cobre TS tambem.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
