sonar.projectKey=AutoSoccer_server
sonar.organization=autosoccer

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**

# sonar.typescript.lcov.reportPaths foi deprecado em 2023 —
# sonar.javascript.lcov.reportPaths cobre TS tambem.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
